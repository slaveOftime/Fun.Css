name: Build and publish nuget packages

on:
  #push:
  #  branches:
  #  - master
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write  # required for NuGet.org trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v7
      
      - name: NuGet login (OIDC -> short-lived API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          # nuget.org profile name (the owner of the trusted publishing policy)
          user: slaveoftime

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet fsi build.fsx -- -p test

      - name: Publish nuget packages
        run: |
          dotnet pack -c Release Fun.Css/Fun.Css.fsproj -o .
          dotnet nuget push *.nupkg -s https://api.nuget.org/v3/index.json -k ${{steps.nuget-login.outputs.NUGET_API_KEY}} --skip-duplicate
